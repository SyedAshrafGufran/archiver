
services:
  # ============================================================
  # MAIN BOT
  # Watches the WhatsApp group and uploads images to Google Drive.
  # ============================================================
  bot:
    build: .
    container_name: wa-drive-collector

    env_file:
      - .env

    volumes:
      # WhatsApp session persistence
      - ./session:/app/session

      # WhatsApp Web / Chromium cache persistence
      - ./.wwebjs_cache:/app/.wwebjs_cache

      # Google OAuth token persistence
      - ./oauth-token.json:/app/oauth-token.json

      # Logs persistence
      - ./logs:/app/logs

    # Chromium needs more shared memory than Docker's default 64MB.
    shm_size: "1gb"

    # Allows WhatsApp QR/login output to work properly in the terminal.
    stdin_open: true
    tty: true

    # Automatically restart the bot if it crashes or Docker restarts.
    restart: unless-stopped


  # ============================================================
  # GOOGLE OAUTH SETUP
  # Run this ONCE to authorize your Google account.
  #
  # Command:
  # docker compose --profile setup run --rm authorize
  #
  # The OAuth callback runs inside Docker on port 53682 and is
  # exposed to your Windows host as localhost:53682.
  # ============================================================
  authorize:
    build: .
    container_name: wa-drive-authorize

    profiles:
      - setup

    command:
      - node
      - oauth-setup.js

    env_file:
      - .env

    # Host port 53682 -> Container port 53682
    ports:
      - "53682:53682"

    # The token generated inside Docker is saved to the host.
    volumes:
      - ./oauth-token.json:/app/oauth-token.json


  # ============================================================
  # LIST WHATSAPP GROUPS
  # One-off utility for finding the WhatsApp group ID.
  #
  # Command:
  # docker compose --profile setup run --rm list-groups
  # ============================================================
  list-groups:
    build: .
    container_name: wa-drive-list-groups

    profiles:
      - setup

    command:
      - node
      - list-groups.js

    volumes:
      # WhatsApp session must be shared/persisted
      - ./session:/app/session

      # WhatsApp Web cache
      - ./.wwebjs_cache:/app/.wwebjs_cache

    # Chromium shared memory
    shm_size: "1gb"

    stdin_open: true
    tty: true

